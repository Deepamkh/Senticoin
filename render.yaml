# Render Blueprint — one FREE web service: Express API + built React app on the same URL.
# Deploy: Render dashboard → New → Blueprint → select this repo.
# Every data source is free; no paid keys are required.
services:
  - type: web
    name: senticoin
    runtime: node
    plan: free
    buildCommand: npm --prefix server install && npm --prefix client install --include=dev && npm --prefix client run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TOP_N
        value: "50"
      - key: MOCK_DATA
        value: "false"
      # Optional FREE CoinGecko Demo key — recommended, since Render's shared IPs hit the keyless limit.
      # Leave blank if you don't have one; you can add it later under Environment.
      - key: COINGECKO_API_KEY
        sync: false
      # Mastodon instances for social chatter (free, no key). Comma-separated hostnames.
      - key: MASTODON_INSTANCES
        value: mastodon.social
